# a summary about you
summary: |
  Je suis Georges, développeur fullstack et DevOps basé en Île-de-France. J'ai fondé **AI AutoHeal**, une agence tech spécialisée dans le développement sur mesure, l'automatisation et le cloud. On y construit aussi des produits SaaS maison : **WebAudit Pro** pour l'audit web automatisé, et **ArbitrageAI** pour le trading algorithmique.

  Mon terrain de jeu : concevoir des architectures solides, automatiser ce qui peut l'être, et livrer des produits qui tournent en prod — pas juste des maquettes. Du backend au déploiement, je gère l'ensemble du cycle.

  Diplômé du CNAM Paris en Développement et Exploitation Informatique, certifié Python, Docker et Linux.

